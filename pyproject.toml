[project]
name = "autoresearch-3d-post-hoc"
version = "0.1.0"
description = "Autonomous research on semantic-guided post-hoc refinement for feed-forward 3D reconstruction (Déjà View + SAGE-10k)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "dvlt",
    "accelerate",
    "einops",
    "timm",
    "transformers>=4.49.0",
    "huggingface-hub",
    "safetensors",
    "numpy",
    "scipy",
    "scikit-learn",
    "open3d",
    "trimesh",
    "pillow",
    "matplotlib",
    "pandas",
    "tqdm",
]

[tool.uv.sources]
dvlt = { git = "https://github.com/nv-tlabs/dvlt.git" }
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
