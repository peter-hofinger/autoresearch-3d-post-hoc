[project]
name = "autoresearch-3d-post-hoc"
version = "0.1.0"
description = "Autonomous research on semantic-guided post-hoc refinement for feed-forward 3D reconstruction (Déjà View + SAGE-10k)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "dvlt",
    "accelerate>=1.0.0",
    "einops>=0.8.0",
    "timm>=1.0.0",
    "transformers>=4.49.0",
    "huggingface-hub>=0.26.0",
    "safetensors>=0.4.5",
    "numpy>=1.26.4,<2.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "open3d>=0.19.0",
    "trimesh>=4.5.0",
    "bpy==4.3.0",
    "pillow>=10.4.0",
    "matplotlib>=3.10.0",
    "pandas>=2.2.0",
    "tqdm>=4.66.0",
]

[tool.uv.sources]
dvlt = { git = "https://github.com/nv-tlabs/dvlt.git" }
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "blender"
url = "https://download.blender.org/pypi/"
